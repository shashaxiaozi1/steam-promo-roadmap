name: Validate CAPCOM catalog and US packages

on:
  pull_request:
    paths:
      - 'capcom-price-tracker/catalog.csv'
      - 'capcom-price-tracker/collector.py'
      - 'capcom-price-tracker/discovery.py'
      - 'capcom-price-tracker/tests/**'
      - '.github/workflows/capcom_prices.yml'
      - '.github/workflows/capcom_catalog_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collector logic
        run: python3 -m unittest discover -s capcom-price-tracker/tests -v
      - name: Validate live US prices and publisher discovery without publishing data
        run: |
          temp_dir="$(mktemp -d)"
          cp capcom-price-tracker/catalog.csv "$temp_dir/catalog.csv"
          python3 capcom-price-tracker/collector.py --discover --catalog "$temp_dir/catalog.csv" --output "$temp_dir/data"
          python3 - "$temp_dir/data/discovery/latest.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report["errors"] or report["appids_seen"] < 30:
              sys.exit("Steam publisher search did not return the expected coverage")
          PY
