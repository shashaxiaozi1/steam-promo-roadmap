name: Steam US weekly-chart watchlist

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/steam_weekly_chart_watch.yml'
      - 'weekly-chart-watch/collect.py'
      - 'weekly-chart-watch/watchlist.csv'
  workflow_dispatch:
  schedule:
    # 08:47 and 20:47 Japan time, staggered from publisher collection.
    - cron: '47 23 * * *'
    - cron: '47 11 * * *'

permissions:
  contents: write

concurrency:
  group: steam-weekly-chart-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Steam US storefront prices
        id: collect
        continue-on-error: true
        run: python3 weekly-chart-watch/collect.py
      - name: Save price observations and missing-price evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- weekly-chart-watch/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: save Steam US weekly-chart watchlist prices"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase FETCH_HEAD
          done
      - name: Report failed collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
