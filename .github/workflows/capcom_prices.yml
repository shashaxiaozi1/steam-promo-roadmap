name: CAPCOM US price snapshots

on:
  workflow_dispatch:
  schedule:
    # 09:17 and 21:17 Japan time; GitHub schedules are best-effort.
    - cron: '17 0,12 * * *'

permissions:
  contents: write

concurrency:
  group: capcom-price-snapshots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect pinned US packages
        run: python3 capcom-price-tracker/collector.py
      - name: Save failed-run responses for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capcom-failed-run-raw
          path: capcom-price-tracker/data/raw/*.jsonl
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit append-only snapshots and Power BI exports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add capcom-price-tracker/data
          if ! git diff --cached --quiet; then
            git commit -m "data: update CAPCOM price snapshots"
            git push
          fi
