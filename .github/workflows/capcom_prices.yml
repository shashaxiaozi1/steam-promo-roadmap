name: Steam US publisher price snapshots

on:
  push:
    branches: [main]
    paths:
      - 'capcom-price-tracker/catalog.csv'
      - 'capcom-price-tracker/catalog_bandai.csv'
      - 'capcom-price-tracker/collector.py'
      - 'capcom-price-tracker/discovery.py'
      - 'capcom-price-tracker/availability.py'
      - '.github/workflows/capcom_prices.yml'
      - '.github/workflows/steam_us_collect_publisher.yml'
  workflow_dispatch:
  schedule:
    # 09:17 and 21:17 Japan time; GitHub schedules are best-effort.
    - cron: '17 0 * * *'
    - cron: '17 12 * * *'

permissions:
  contents: write

concurrency:
  group: capcom-price-snapshots
  cancel-in-progress: false

jobs:
  bandai:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/steam_us_collect_publisher.yml
    with:
      publisher: BANDAI NAMCO
      slug: bandai
      discover: ${{ github.event_name != 'schedule' || github.event.schedule == '17 0 * * *' }}
      audit_availability: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *' }}
  capcom:
    needs: bandai
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/steam_us_collect_publisher.yml
    with:
      publisher: CAPCOM
      slug: capcom
      discover: ${{ github.event_name != 'schedule' || github.event.schedule == '17 0 * * *' }}
      audit_availability: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *' }}
