name: Steam US publisher price snapshots

on:
  push:
    branches: [main]
    paths:
      - 'capcom-price-tracker/catalog*.csv'
      - 'capcom-price-tracker/excluded*.csv'
      - 'capcom-price-tracker/collector.py'
      - 'capcom-price-tracker/discovery.py'
      - 'capcom-price-tracker/publisher_config.py'
      - 'capcom-price-tracker/availability.py'
      - 'capcom-price-tracker/price_history.py'
      - 'capcom-price-tracker/data/history/**'
      - '.github/workflows/capcom_prices.yml'
      - '.github/workflows/steam_us_collect_publisher.yml'
  workflow_dispatch:
  schedule:
    # 09:17 and 21:17 Japan time; GitHub schedules are best-effort.
    - cron: '17 0 * * *'
    - cron: '17 12 * * *'

permissions:
  contents: write

concurrency:
  group: capcom-price-snapshots
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publishers: ${{ steps.registry.outputs.publishers }}
    steps:
      - uses: actions/checkout@v4
      - id: registry
        name: Read publisher registry
        run: |
          publishers=$(python3 capcom-price-tracker/publisher_config.py)
          echo "publishers=$publishers" >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    strategy:
      # Every publisher starts on a fresh runner. Serialize publication of the
      # shared Power BI files; a publisher failure must not cancel the others.
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.publishers) }}
    uses: ./.github/workflows/steam_us_collect_publisher.yml
    with:
      publisher: ${{ matrix.publisher }}
      slug: ${{ matrix.slug }}
      discover: ${{ github.event_name != 'schedule' || github.event.schedule == '17 0 * * *' }}
      audit_availability: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *' }}
