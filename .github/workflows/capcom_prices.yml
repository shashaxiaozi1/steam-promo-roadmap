name: Steam US publisher price snapshots

on:
  push:
    branches: [main]
    paths:
      - 'capcom-price-tracker/catalog*.csv'
      - 'capcom-price-tracker/excluded*.csv'
      - 'capcom-price-tracker/collector.py'
      - 'capcom-price-tracker/discovery.py'
      - 'capcom-price-tracker/publisher_config.py'
      - 'capcom-price-tracker/availability.py'
      - 'capcom-price-tracker/price_history.py'
      - 'capcom-price-tracker/capcom_history.py'
      - 'capcom-price-tracker/rebuild_reports.py'
      - 'capcom-price-tracker/collection_coverage.py'
      - 'capcom-price-tracker/data/lifecycle/**'
      - 'capcom-price-tracker/data/collection_status/**'
      - 'capcom-price-tracker/data/history/**'
      - '.github/workflows/capcom_prices.yml'
      - '.github/workflows/steam_us_collect_publisher.yml'
  workflow_dispatch:
  schedule:
    # 09:17 and 21:17 Japan time; GitHub schedules are best-effort.
    - cron: '17 0 * * *'
    - cron: '17 12 * * *'

permissions:
  contents: write

concurrency:
  group: capcom-price-snapshots
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publishers: ${{ steps.registry.outputs.publishers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild approved history before collecting prices
        run: |
          python3 capcom-price-tracker/rebuild_reports.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- capcom-price-tracker/data/powerbi
          if ! git diff --cached --quiet; then
            git commit -m "data: rebuild verified Steam price history"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              git fetch origin main
              if git merge-base --is-ancestor FETCH_HEAD HEAD; then exit 1; fi
              if ! git rebase FETCH_HEAD; then
                git rebase --abort
                exit 1
              fi
            done
          fi
      - id: registry
        name: Read publisher registry
        run: |
          publishers=$(python3 capcom-price-tracker/publisher_config.py)
          echo "publishers=$publishers" >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    strategy:
      # Every publisher starts on a fresh runner. Serialize publication of the
      # shared Power BI files; a publisher failure must not cancel the others.
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.publishers) }}
    uses: ./.github/workflows/steam_us_collect_publisher.yml
    with:
      publisher: ${{ matrix.publisher }}
      slug: ${{ matrix.slug }}
      discover: ${{ github.event_name != 'schedule' || github.event.schedule == '17 0 * * *' }}
      audit_availability: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *' }}
