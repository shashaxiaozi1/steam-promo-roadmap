name: Collect one Steam US publisher

on:
  workflow_call:
    inputs:
      publisher:
        required: true
        type: string
      slug:
        required: true
        type: string
      discover:
        required: true
        type: boolean
      audit_availability:
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The publishers have separate runners. Start from the latest main
      # so the second job picks up the first publisher's published rows.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect US prices
        id: collect
        continue-on-error: true
        env:
          PUBLISHER: ${{ inputs.publisher }}
          CHECK_NEW_RELEASES: ${{ inputs.discover }}
          CHECK_AVAILABILITY: ${{ inputs.audit_availability }}
        run: |
          args=(--publisher "$PUBLISHER")
          if [ "$CHECK_NEW_RELEASES" = "true" ]; then
            args+=(--discover)
          fi
          if [ "$CHECK_AVAILABILITY" = "true" ]; then
            args+=(--audit-availability)
          fi
          python3 capcom-price-tracker/collector.py "${args[@]}"
      - name: Save failed-run responses for diagnosis
        if: steps.collect.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: steam-us-${{ inputs.slug }}-failed-run-raw
          path: capcom-price-tracker/data/raw/*.jsonl
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit publisher samples and availability evidence
        env:
          PUBLISHER: ${{ inputs.publisher }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add capcom-price-tracker/catalog.csv capcom-price-tracker/catalog_bandai.csv capcom-price-tracker/data
          if ! git diff --cached --quiet; then
            git commit -m "data: update Steam US $PUBLISHER snapshots"
            git push
          fi
      - name: Report collection failure after saving evidence
        if: steps.collect.outcome == 'failure'
        run: exit 1
